<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Nummer → QR</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --line:#2a2f3a; --txt:#e8eaf0; --mut:#8b92a3; --acc:#22c55e; --warn:#f59e0b; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--txt);
         min-height:100vh; padding:12px; padding-bottom:40px; }
  h1 { font-size:18px; font-weight:600; margin:4px 0 12px; }
  h1 span { color:var(--mut); font-weight:400; font-size:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:12px; }
  .cam { position:relative; width:100%; aspect-ratio:3/4; max-height:60vh; background:#000; border-radius:10px; overflow:hidden; }
  video { width:100%; height:100%; object-fit:cover; display:block; }
  .roi { position:absolute; left:10%; right:10%; top:43%; height:14%; border:3px solid var(--acc);
         border-radius:8px; box-shadow:0 0 0 9999px rgba(0,0,0,.45); pointer-events:none; }
  .roi.busy { border-color:var(--warn); }
  .hint { position:absolute; left:0; right:0; top:calc(43% - 30px); text-align:center; font-size:13px; color:#fff; text-shadow:0 1px 3px #000; }
  .camMsg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center;
            padding:20px; font-size:14px; color:var(--mut); }
  .row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  button { flex:1; min-width:90px; padding:13px 10px; font-size:15px; font-weight:600; border-radius:10px; border:1px solid var(--line);
           background:#252a34; color:var(--txt); cursor:pointer; }
  button.primary { background:var(--acc); border-color:var(--acc); color:#04140a; }
  button.on { background:#14532d; border-color:var(--acc); }
  button:disabled { opacity:.5; }
  label { font-size:13px; color:var(--mut); display:block; margin-bottom:6px; }
  .inputWrap { display:flex; align-items:center; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#11141a; }
  .prefix { padding:12px 4px 12px 12px; font-family:ui-monospace,Menlo,monospace; font-size:18px; color:var(--mut); white-space:nowrap; }
  input { flex:1; min-width:0; padding:12px 12px 12px 2px; font-size:18px; font-family:ui-monospace,Menlo,monospace;
          background:transparent; border:0; color:var(--txt); outline:none; letter-spacing:1px; }
  .status { font-size:13px; color:var(--mut); margin-top:8px; min-height:18px; }
  .qrBox { display:flex; flex-direction:column; align-items:center; gap:10px; }
  #qr { background:#fff; padding:14px; border-radius:12px; width:min(78vw,300px); aspect-ratio:1; display:flex; align-items:center; justify-content:center; }
  #qr img, #qr svg { width:100%; height:100%; image-rendering:pixelated; }
  #qr .empty { color:#999; font-size:14px; text-align:center; }
  .code { font-family:ui-monospace,Menlo,monospace; font-size:17px; word-break:break-all; text-align:center; }
  .hist { list-style:none; font-family:ui-monospace,Menlo,monospace; font-size:14px; }
  .hist li { padding:8px 4px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; cursor:pointer; }
  .hist li:last-child { border-bottom:0; }
  .hist small { color:var(--mut); }
  #fileIn { display:none; }
  #dbg { display:block; max-width:100%; max-height:70px; border-radius:6px; background:#fff; }
  .lenRow { display:flex; align-items:center; gap:10px; margin-top:12px; }
  .lenRow label { margin:0; flex:1; }
  .lenRow input { flex:0 0 90px; border:1px solid var(--line); border-radius:10px; background:#11141a; padding:10px; text-align:center; }
  #chips { margin-top:8px; }
  .chip { flex:none; display:inline-block; min-width:0; margin:6px 6px 0 0; padding:10px 14px; font-family:ui-monospace,Menlo,monospace; font-size:15px; }
  .tip { font-size:12px; color:var(--mut); margin-top:6px; }
</style>
</head>
<body>
<h1>Nummer → QR <span>(91)611 + Nummer</span></h1>

<div class="card">
  <div class="cam">
    <video id="video" playsinline muted autoplay></video>
    <div class="hint">Nummer in den grünen Rahmen halten</div>
    <div class="roi" id="roi"></div>
    <div class="camMsg" id="camMsg">Kamera wird gestartet…</div>
  </div>
  <div class="row">
    <button class="primary" id="btnRead">📷 Lesen</button>
    <button id="btnAuto">Automatisch: Aus</button>
    <button id="btnTorch" style="display:none">🔦 Licht</button>
  </div>
  <div class="row">
    <button id="btnBarcode">▥ Barcode lesen</button>
    <button id="btnPhoto">🖼️ Aus Foto</button>
  </div>
  <input type="file" id="fileIn" accept="image/*" capture="environment">
  <div class="status" id="status"></div>
  <div id="chips" style="display:none"></div>
  <div id="dbgWrap" style="display:none"><label style="margin-top:8px">Bild, das die Texterkennung sieht:</label><img id="dbg" alt=""></div>
  <div class="lenRow">
    <label for="len">Wie viele Stellen hat die Nummer?</label>
    <input id="len" type="number" inputmode="numeric" min="0" max="30" placeholder="z. B. 9">
  </div>
  <div class="tip">Mit Stellenzahl werden zu kurze/zu lange Ergebnisse verworfen – es wird auf das richtige gewartet.</div>
</div>

<div class="card">
  <label for="num">Erkannte Nummer (bei Bedarf korrigieren)</label>
  <div class="inputWrap">
    <span class="prefix">(91)611</span>
    <input id="num" inputmode="numeric" pattern="[0-9]*" placeholder="Nummer" autocomplete="off">
  </div>
</div>

<div class="card qrBox">
  <div id="qr"><div class="empty">Sobald die Nummer erkannt ist,<br>erscheint hier der QR-Code</div></div>
  <div class="code" id="codeText"></div>
  <div class="row" style="width:100%">
    <button id="btnSave" disabled>⬇️ Als PNG speichern</button>
    <button id="btnCopy" disabled>📋 Kopieren</button>
  </div>
</div>

<div class="card">
  <label>Zuletzt erkannt</label>
  <ul class="hist" id="hist"></ul>
</div>

<script>
const PREFIX = '(91)611';
const $ = id => document.getElementById(id);
const video = $('video'), roi = $('roi'), statusEl = $('status'), numIn = $('num');
let camOk = false, stream = null, track = null, worker = null, busy = false, autoTimer = null, torchOn = false;
let history = [];
try { history = JSON.parse(localStorage.getItem('qrHist') || '[]'); } catch (e) {}

function setStatus(t) { statusEl.textContent = t; }

// ---------- Kamera ----------
function camFail(msg) {
  camOk = false;
  roi.style.display = 'none';
  document.querySelector('.hint').style.display = 'none';
  $('camMsg').innerHTML = msg;
  $('btnRead').textContent = '📷 Foto aufnehmen & lesen';
  $('btnAuto').style.display = 'none';
}
async function startCamera() {
  if (!window.isSecureContext) {
    camFail('Live-Kamera ist unter dieser Adresse gesperrt (HTTPS erforderlich).<br><br>Der Button <b>„📷 Foto aufnehmen & lesen“</b> öffnet die Handykamera und funktioniert genauso.');
    return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    camFail('Dieser Browser unterstützt keine Live-Kamera.<br><br>Bitte den Button <b>„📷 Foto aufnehmen & lesen“</b> verwenden.');
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }
    });
    video.srcObject = stream;
    await video.play();
    $('camMsg').style.display = 'none';
    camOk = true;
    track = stream.getVideoTracks()[0];
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (caps.torch) $('btnTorch').style.display = '';
    if (caps.focusMode && caps.focusMode.includes('continuous')) {
      track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
    }
  } catch (e) {
    camFail('Kein Zugriff auf die Kamera (' + e.name + ').<br><br>Kamera-Berechtigung in den Browser-Einstellungen erlauben oder den Button <b>„📷 Foto aufnehmen & lesen“</b> verwenden.');
  }
}

$('btnTorch').onclick = async () => {
  if (!track) return;
  torchOn = !torchOn;
  try { await track.applyConstraints({ advanced: [{ torch: torchOn }] }); $('btnTorch').classList.toggle('on', torchOn); }
  catch (e) { torchOn = false; }
};

// ---------- OCR ----------
const lenIn = $('len');
try { lenIn.value = localStorage.getItem('qrLen') || ''; } catch (e) {}
lenIn.addEventListener('change', () => { try { localStorage.setItem('qrLen', lenIn.value); } catch (e) {} });
const expectedLen = () => { const n = parseInt(lenIn.value, 10); return n > 0 ? n : 0; };
const lenOk = s => { const L = expectedLen(); return L ? s.length === L : s.length >= 3; };
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function getWorker() {
  if (worker) return worker;
  setStatus('Texterkennung wird geladen (beim ersten Mal einige Sekunden)…');
  worker = await Tesseract.createWorker('eng', 1, {}, { load_system_dawg: '0', load_freq_dawg: '0' });
  await worker.setParameters({ tessedit_char_whitelist: '0123456789', tessedit_pageseg_mode: '7' });
  return worker;
}

// Görüntüyü OCR için hazırla. mode: adaptive (parlama/gölgeye dayanıklı), otsu, stretch
function variant(src, mode, targetH) {
  const k = targetH / src.height;
  const w = Math.max(1, Math.round(src.width * k)), h = targetH;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.imageSmoothingQuality = 'high';
  if (mode !== 'stretch') ctx.filter = 'blur(1px)';   // nokta vuruşlu rakamları birleştirir
  ctx.drawImage(src, 0, 0, w, h);
  ctx.filter = 'none';
  const img = ctx.getImageData(0, 0, w, h), d = img.data, N = w * h;
  const g = new Float32Array(N), out = new Uint8ClampedArray(N);
  for (let i = 0, j = 0; j < N; i += 4, j++) g[j] = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];

  if (mode === 'stretch') {
    const sorted = Float32Array.from(g).sort();
    const lo = sorted[Math.floor(N * 0.02)], hi = sorted[Math.floor(N * 0.98)], rng = Math.max(1, hi - lo);
    for (let j = 0; j < N; j++) out[j] = (g[j] - lo) * 255 / rng;
  } else if (mode === 'otsu') {
    const hist = new Array(256).fill(0);
    for (let j = 0; j < N; j++) hist[g[j] | 0]++;
    let sum = 0; for (let t = 0; t < 256; t++) sum += t * hist[t];
    let sB = 0, wB = 0, best = 0, th = 128;
    for (let t = 0; t < 256; t++) {
      wB += hist[t]; if (!wB) continue;
      const wF = N - wB; if (!wF) break;
      sB += t * hist[t];
      const mB = sB / wB, mF = (sum - sB) / wF, v = wB * wF * (mB - mF) * (mB - mF);
      if (v > best) { best = v; th = t; }
    }
    for (let j = 0; j < N; j++) out[j] = g[j] > th ? 255 : 0;
  } else { // adaptive: yerel ortalamaya göre eşikleme (integral görüntü)
    const W = w + 1, I = new Float64Array(W * (h + 1));
    for (let y = 0; y < h; y++) { let row = 0;
      for (let x = 0; x < w; x++) { row += g[y * w + x]; I[(y + 1) * W + x + 1] = I[y * W + x + 1] + row; } }
    const r = Math.max(8, Math.round(Math.min(h / 3, 40)));
    for (let y = 0; y < h; y++) {
      const y0 = Math.max(0, y - r), y1 = Math.min(h, y + r + 1);
      for (let x = 0; x < w; x++) {
        const x0 = Math.max(0, x - r), x1 = Math.min(w, x + r + 1);
        const area = (y1 - y0) * (x1 - x0);
        const m = (I[y1 * W + x1] - I[y0 * W + x1] - I[y1 * W + x0] + I[y0 * W + x0]) / area;
        out[y * w + x] = g[y * w + x] < m - 12 ? 0 : 255;
      }
    }
  }
  for (let j = 0, i = 0; j < N; j++, i += 4) { d[i] = d[i + 1] = d[i + 2] = out[j]; d[i + 3] = 255; }
  ctx.putImageData(img, 0, 0);
  // Kenarlara beyaz boşluk ekle (Tesseract kenara yapışık yazıyı kötü okur)
  const p = document.createElement('canvas'); p.width = w + 40; p.height = h + 40;
  const pc = p.getContext('2d'); pc.fillStyle = '#fff'; pc.fillRect(0, 0, p.width, p.height); pc.drawImage(c, 20, 20);
  return p;
}

// Videodan sadece yeşil çerçevenin içini kes
function grabRoi() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw) return null;
  const vr = video.getBoundingClientRect(), rr = roi.getBoundingClientRect();
  const s = Math.max(vr.width / vw, vr.height / vh);         // object-fit: cover ölçeği
  const ox = (vw * s - vr.width) / 2, oy = (vh * s - vr.height) / 2;
  const sx = (rr.left - vr.left + ox) / s, sy = (rr.top - vr.top + oy) / s;
  const sw = rr.width / s, sh = rr.height / s;
  const c = document.createElement('canvas');
  c.width = Math.round(sw); c.height = Math.round(sh);
  c.getContext('2d').drawImage(video, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c;
}

// Oylama: aynı sonucu birden fazla deneme verirse ona güvenilir
function addVote(votes, s, conf, img) {
  if (s.length < 3) return;
  const v = votes.get(s) || { s, n: 0, conf: 0, img };
  v.n++; v.conf = Math.max(v.conf, conf); v.img = img; votes.set(s, v);
}
function pick(votes) {
  const L = expectedLen(); let best = null, bs = -1e9;
  for (const v of votes.values()) {
    let sc = v.n * 60 + v.conf;
    if (L) sc += v.s.length === L ? 200 : -40 * Math.abs(v.s.length - L);
    else sc += v.s.length * 8;
    if (sc > bs) { bs = sc; best = v; }
  }
  return best;
}
function showDbg(img) { if (img) { $('dbg').src = img.toDataURL(); $('dbgWrap').style.display = ''; } }

function accept(v) {
  numIn.value = v.s;
  update(true);
  showDbg(v.img);
  const L = expectedLen();
  if (L && v.s.length !== L) setStatus('⚠️ ' + v.s.length + ' Stellen erkannt, ' + L + ' erwartet: ' + v.s + ' – bitte prüfen oder erneut lesen.');
  else setStatus('✅ Erkannt: ' + v.s);
  if (navigator.vibrate) navigator.vibrate(80);
}

// Farklı ölçek / sayfa modu / harf filtresi denemeleri — sonuçlar oylanır
const COMBOS = [
  { mode: 'adaptive', H: 180, psm: '7',  wl: true  },
  { mode: 'adaptive', H: 130, psm: '7',  wl: false },
  { mode: 'adaptive', H: 120, psm: '13', wl: true  },
  { mode: 'adaptive', H: 150, psm: '7',  wl: false },
  { mode: 'adaptive', H: 180, psm: '13', wl: true  },
  { mode: 'stretch',  H: 150, psm: '7',  wl: false },
];
// Çizgili sıfır (Ø) gibi rakama benzeyen karakterleri rakama çevir
function toDigitsCandidates(text, wl) {
  let t = (text.split('\n').find(l => l.trim()) || '');
  if (!wl) t = t.replace(/[QOoDØø@°θeC]/g, '0').replace(/[Il|!]/g, '1').replace(/[B]/g, '8').replace(/[S]/g, '5').replace(/[Z]/g, '2');
  const parts = t.split(/\s+/).map(x => x.replace(/\D/g, '')).filter(Boolean);
  // Kenardaki tek haneli parçalar genelde barkod çizgisi/gürültüdür: birleştirirken at
  const concat = parts.filter(x => x.length > 1).join('') || parts.join('');
  const tokens = parts.slice().sort((a, b) => b.length - a.length);
  const out = [concat];
  if (tokens[0] && tokens[0] !== concat) out.push(tokens[0]);
  return out;
}
async function ocrCombo(src, cb) {
  const w = await getWorker();
  await w.setParameters({ tessedit_pageseg_mode: cb.psm, tessedit_char_whitelist: cb.wl ? '0123456789' : '' });
  const img = variant(src, cb.mode, cb.H);
  const { data } = await w.recognize(img);
  return { cands: toDigitsCandidates(data.text, cb.wl), conf: data.confidence, img };
}
async function ocrOnce(src, mode, psm, targetH) {
  const w = await getWorker();
  await w.setParameters({ tessedit_pageseg_mode: psm, tessedit_char_whitelist: '0123456789' });
  const img = variant(src, mode, targetH);
  const { data } = await w.recognize(img);
  return { data, img };
}
function ranked(votes) {
  const L = expectedLen();
  return [...votes.values()].map(v => {
    let sc = v.n * 60 + v.conf;
    if (L) sc += v.s.length === L ? 200 : -40 * Math.abs(v.s.length - L); else sc += v.s.length * 8;
    return { v, sc };
  }).sort((a, b) => b.sc - a.sc).map(x => x.v);
}
// Alternatif okumaları dokunulabilir buton olarak göster
function showChips(list, title) {
  const box = $('chips');
  box.innerHTML = '';
  if (!list.length) { box.style.display = 'none'; return; }
  const lb = document.createElement('div'); lb.className = 'tip'; lb.textContent = title; box.appendChild(lb);
  list.forEach(item => {
    const b = document.createElement('button'); b.className = 'chip';
    b.textContent = item.label || item.s;
    b.onclick = () => { numIn.value = item.s; update(true); setStatus('✅ Ausgewählt: ' + item.s); };
    box.appendChild(b);
  });
  box.style.display = '';
}

// Manuel okuma: 2 kare × 3 işleme yöntemi, sonuçları oylar
async function manualRead() {
  if (busy) return;
  busy = true; roi.classList.add('busy'); setStatus('Wird gelesen… Handy ruhig halten');
  try {
    const votes = new Map();
    outer: for (let f = 0; f < 2; f++) {
      const src = grabRoi(); if (!src) { setStatus('Kamera ist nicht bereit.'); return; }
      for (const cb of COMBOS) {
        const r = await ocrCombo(src, cb);
        r.cands.forEach(c => addVote(votes, c, r.conf, r.img));
        const b = pick(votes);
        if (b && b.n >= 3 && lenOk(b.s)) break outer;
      }
    }
    const list = ranked(votes);
    showChips(list.slice(1, 4).filter(v => lenOk(v.s) || !expectedLen()), 'Falsch? Andere Ergebnisse antippen:');
    const b = list[0];
    if (b) accept(b); else setStatus('Keine Nummer gefunden. Ziffern sollen den Rahmen in der Breite ausfüllen – ggf. Licht einschalten und erneut versuchen.');
  } catch (e) {
    setStatus('Fehler bei der Texterkennung: ' + e.message);
  } finally { busy = false; roi.classList.remove('busy'); }
}
$('btnRead').onclick = () => { if (!camOk) { $('fileIn').click(); return; } manualRead(); };

// Otomatik: aynı numarayı 2 kez görene kadar tarar
let autoVotes = new Map(), autoStep = 0;
$('btnAuto').onclick = () => {
  if (autoTimer) { stopAuto(); return; }
  autoVotes = new Map(); autoStep = 0;
  $('btnAuto').textContent = 'Automatisch: Ein'; $('btnAuto').classList.add('on');
  setStatus('Automatischer Scan… Nummer in den Rahmen halten.');
  autoTimer = setInterval(async () => {
    if (busy) return;
    const src = grabRoi(); if (!src) return;
    busy = true; roi.classList.add('busy');
    try {
      const r = await ocrCombo(src, COMBOS[autoStep++ % COMBOS.length]);
      r.cands.forEach(c => addVote(autoVotes, c, r.conf, r.img));
      const b = pick(autoVotes);
      if (b && b.n >= 3 && lenOk(b.s)) {
        stopAuto(); accept(b);
        showChips(ranked(autoVotes).slice(1, 4).filter(v => lenOk(v.s)), 'Falsch? Andere Ergebnisse antippen:');
      }
      else if (b) setStatus('Scanne… aktuell erkannt: ' + b.s);
    } catch (e) {} finally { busy = false; roi.classList.remove('busy'); }
  }, 300);
};
function stopAuto() {
  clearInterval(autoTimer); autoTimer = null;
  $('btnAuto').textContent = 'Automatisch: Aus'; $('btnAuto').classList.remove('on');
}

// Barkod / Data Matrix okuma (Chrome Android'in yerleşik okuyucusu)
let barcodeBusy = false;
$('btnBarcode').onclick = async () => {
  if (!('BarcodeDetector' in window)) { setStatus('Dieser Browser kann keine Barcodes lesen (Chrome auf Android erforderlich).'); return; }
  if (!camOk) { setStatus('Für Barcodes wird die Live-Kamera benötigt.'); return; }
  if (barcodeBusy) return;
  barcodeBusy = true; stopAuto();
  setStatus('Suche Barcode… Barcode auf dem Etikett vor die Kamera halten.');
  try {
    const det = new BarcodeDetector();
    const found = new Map(); const t0 = Date.now(); let tFirst = 0;
    while (Date.now() - t0 < 8000) {
      const codes = await det.detect(video).catch(() => []);
      codes.forEach(c => { if (c.rawValue && !found.has(c.rawValue)) found.set(c.rawValue, c.format); });
      if (found.size && !tFirst) tFirst = Date.now();
      if (tFirst && Date.now() - tFirst > 1200) break;
      await sleep(150);
    }
    if (!found.size) { setStatus('Kein Barcode gefunden. Näher herangehen, ggf. Licht einschalten und erneut versuchen.'); return; }
    const L = expectedLen(), items = [];
    for (const [raw, fmt] of found) {
      const runs = raw.match(/\d+/g) || [];
      let s = L ? (runs.find(r => r.length === L) || raw.replace(/\D/g, '')) : raw.replace(/\D/g, '');
      if (s) items.push({ s, label: s + '  (' + fmt + (raw !== s ? ': ' + raw : '') + ')' });
    }
    if (!items.length) { setStatus('Barcode gelesen, enthält aber keine Ziffern: ' + [...found.keys()].join(', ')); return; }
    showChips(items, 'Gefunden in Barcodes – richtige Nummer antippen:');
    if (items.length === 1) { numIn.value = items[0].s; update(true); setStatus('✅ Aus Barcode gelesen: ' + items[0].s); if (navigator.vibrate) navigator.vibrate(80); }
    else setStatus(items.length + ' Barcodes gefunden – unten den richtigen auswählen.');
  } finally { barcodeBusy = false; }
};

// Fotoğraftan okuma (canlı kamera yoksa yedek yol)
$('btnPhoto').onclick = () => $('fileIn').click();
$('fileIn').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  e.target.value = '';
  const im = new Image();
  im.onload = async () => {
    URL.revokeObjectURL(im.src);
    if (busy) return;
    busy = true; setStatus('Foto wird gelesen…');
    try {
      const c = document.createElement('canvas');
      const k = Math.min(1, 1600 / Math.max(im.width, im.height));
      c.width = im.width * k; c.height = im.height * k;
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      const votes = new Map();
      for (const m of ['adaptive', 'stretch']) {
        const { data, img } = await ocrOnce(c, m, '11', c.height);
        data.text.split('\n').forEach(line => addVote(votes, line.replace(/\D/g, ''), data.confidence, img));
      }
      const b = pick(votes);
      if (b) accept(b); else setStatus('Keine Nummer im Foto gefunden. Bitte näher an der Nummer fotografieren.');
    } catch (err) { setStatus('Fehler bei der Texterkennung: ' + err.message); }
    finally { busy = false; }
  };
  im.src = URL.createObjectURL(f);
};

// ---------- QR ----------
let currentCode = '';
function update(addHist) {
  const n = numIn.value.replace(/\D/g, '');
  if (numIn.value !== n) numIn.value = n;
  const box = $('qr');
  if (!n) {
    box.innerHTML = '<div class="empty">Sobald die Nummer erkannt ist,<br>erscheint hier der QR-Code</div>';
    $('codeText').textContent = ''; currentCode = '';
    $('btnSave').disabled = $('btnCopy').disabled = true;
    return;
  }
  currentCode = PREFIX + n;
  const qr = qrcode(0, 'M');
  qr.addData(currentCode);
  qr.make();
  box.innerHTML = qr.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
  $('codeText').textContent = currentCode;
  $('btnSave').disabled = $('btnCopy').disabled = false;
  if (addHist) addHistory(currentCode);
}
numIn.addEventListener('input', () => update(false));
numIn.addEventListener('change', () => update(true));

$('btnSave').onclick = () => {
  if (!currentCode) return;
  const qr = qrcode(0, 'M'); qr.addData(currentCode); qr.make();
  const cells = qr.getModuleCount(), cs = 12, m = 4 * cs, size = cells * cs + 2 * m;
  const c = document.createElement('canvas'); c.width = size; c.height = size + 60;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.fillStyle = '#000';
  for (let r = 0; r < cells; r++) for (let q = 0; q < cells; q++)
    if (qr.isDark(r, q)) ctx.fillRect(m + q * cs, m + r * cs, cs, cs);
  ctx.font = 'bold 26px monospace'; ctx.textAlign = 'center';
  ctx.fillText(currentCode, size / 2, size + 30);
  const a = document.createElement('a');
  a.href = c.toDataURL('image/png');
  a.download = 'QR_' + currentCode.replace(/[()]/g, '') + '.png';
  a.click();
};

$('btnCopy').onclick = async () => {
  try { await navigator.clipboard.writeText(currentCode); setStatus('Kopiert: ' + currentCode); }
  catch (e) { setStatus('Kopieren fehlgeschlagen.'); }
};

// ---------- Geçmiş ----------
function addHistory(code) {
  history = [{ code, t: Date.now() }, ...history.filter(h => h.code !== code)].slice(0, 20);
  try { localStorage.setItem('qrHist', JSON.stringify(history)); } catch (e) {}
  renderHist();
}
function renderHist() {
  const ul = $('hist');
  ul.innerHTML = history.length ? '' : '<li><small>Noch keine</small></li>';
  history.forEach(h => {
    const li = document.createElement('li');
    const d = new Date(h.t);
    li.innerHTML = '<span>' + h.code + '</span><small>' + d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + '</small>';
    li.onclick = () => { numIn.value = h.code.slice(PREFIX.length); update(false); window.scrollTo({ top: 0, behavior: 'smooth' }); };
    ul.appendChild(li);
  });
}

renderHist();
startCamera();
getWorker().then(() => setStatus('Bereit. Nummer in den Rahmen halten und „Lesen“ drücken.')).catch(() => {});
</script>
